<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Norris TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#141414;
color:white;
overflow-x:hidden;
}

/* Header */

header{
position:sticky;
top:0;
z-index:999;
background:linear-gradient(
to bottom,
rgba(0,0,0,0.98) 0%,
rgba(0,0,0,0.90) 35%,
rgba(0,0,0,0.72) 60%,
rgba(0,0,0,0.45) 80%,
rgba(0,0,0,0) 100%
);
backdrop-filter: blur(8px);
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:28px;
font-weight:bold;
color:#e50914;
}

.search{
width:220px;
padding:10px 15px;
border:none;
border-radius:30px;
background:#2a2a2a;
color:white;
outline:none;
}

/* Player */

.player-wrapper{
padding:15px;
transition:.35s ease;
position:relative;
z-index:999;
}

.player-wrapper.mini{
position:fixed;
top:80px;
right:15px;
width:320px;
z-index:9999;
padding:0;
padding-bottom:10px;
background:#000;
border-radius:18px;
box-shadow:0 8px 30px rgba(0,0,0,.5);
overflow:hidden;
}

video{
width:100%;
height:55vh;
background:black;
border-radius:16px;
object-fit:cover;
transition:.35s ease;
}

.player-wrapper.mini video{
height:180px;
border-radius:18px;
}

.now-playing{
font-size:22px;
font-weight:bold;
margin-top:12px;
padding-left:15px;
position:relative;
z-index:1;
}
/* Categories */

.section{
padding:15px;
}

.section-title{
font-size:22px;
margin-bottom:12px;
font-weight:bold;
}

/* Channel cards */

.channel-row{
display:flex;
overflow-x:auto;
gap:28px;
scroll-behavior:smooth;
padding:10px 0 18px 0;
}

.channel-row::-webkit-scrollbar{
display:none;
}

.channel-card{
min-width:150px;
max-width:150px;
background:#222;
border-radius:14px;
overflow:hidden;
cursor:pointer;
transition:.25s;
flex-shrink:0;
}
.channel-card:hover{
transform:scale(1.08);
}

.channel-card img{
width:100%;
height:90px;
object-fit:contain;
background:#fff;
padding:10px;
border-radius:12px;
display:block;
max-width:100%;
}
.channel-info{
padding:10px;
}

.channel-name{
font-size:15px;
font-weight:bold;
}

.group-name{
font-size:12px;
color:#aaa;
margin-top:4px;
}

/* Mobile */

@media(max-width:768px){

.search{
width:140px;
font-size:14px;
}

video{
height:32vh;
}

.channel-card{
min-width:120px;
}

.channel-card img{
height:85px;
}

.logo{
font-size:22px;
}

.now-playing{
font-size:18px;
}

/* MINI PLAYER MOBILE */

.player-wrapper.mini{
width:220px;
top:70px;
right:10px;
}

.player-wrapper.mini video{
height:130px;
}

}
</style>
</head>

<body>

<header>
<div class="logo">Norris TV</div>
<input type="text" class="search" id="search" placeholder="Search channels">
</header>

<div class="player-wrapper">
<video id="video" controls autoplay></video>
<div class="now-playing" id="nowPlaying">
Select a channel
</div>
</div>

<div id="categories"></div>

<script>

const playlistURL = "https://raw.githubusercontent.com/NORRIS63/NorrisTV/main/playlist.m3u";

const video =
document.getElementById("video");

const nowPlaying =
document.getElementById("nowPlaying");

const categoriesDiv =
document.getElementById("categories");

const searchInput =
document.getElementById("search");

let channels = [];

fetch(playlistURL)
.then(res=>res.text())
.then(data=>{
parseM3U(data);
renderCategories(channels);
});

function parseM3U(data){

const lines =
data.split("\n");

for(let i=0;i<lines.length;i++){

if(lines[i].indexOf("#EXTINF") === 0){

const info = lines[i];
const url =
lines[i+1]
? lines[i+1].trim()
: "";

const name =
info.split(",").pop().trim();

const logo =
info.match(/tvg-logo="(.*?)"/);

const group =
info.match(/group-title="(.*?)"/);

channels.push({
name,
url,
logo: logo ? logo[1] : "",
group: group ? group[1] : "Others"
});
}
}
}

function renderCategories(list){

categoriesDiv.innerHTML = "";

const grouped = {};

list.forEach(channel=>{

if(!grouped[channel.group]){
grouped[channel.group] = [];
}

grouped[channel.group].push(channel);

});

Object.keys(grouped).forEach(group=>{

const section =
document.createElement("div");

section.className =
"section";

const title =
document.createElement("div");

title.className =
"section-title";

title.innerText = group;

const row =
document.createElement("div");

row.className =
"channel-row";

grouped[group].forEach(ch=>{

const card =
document.createElement("div");

card.className =
"channel-card";

card.innerHTML = `
<img src="${ch.logo}"
onerror="this.src='https://via.placeholder.com/150'">

<div class="channel-info">
<div class="channel-name">
${ch.name}
</div>

<div class="group-name">
${ch.group}
</div>
</div>
`;

card.addEventListener("click",()=>{

playChannel(ch.url,ch.name);

});

row.appendChild(card);

});

section.appendChild(title);
section.appendChild(row);

categoriesDiv.appendChild(section);

});

}

function playChannel(url,name){

if(Hls.isSupported()){

if(window.currentHls){
window.currentHls.destroy();
}

const hls = new Hls();

window.currentHls = hls;

hls.loadSource(url);
hls.attachMedia(video);

hls.on(
Hls.Events.MANIFEST_PARSED,
function(){
video.play();
});

}else{

video.src = url;
video.play();

}

nowPlaying.innerText =
"Now Playing: " + name;

video.play();

}

searchInput
.addEventListener("input",()=>{

const value =
searchInput.value
.toLowerCase();

const filtered =
channels.filter(c=>
c.name.toLowerCase()
.includes(value)
);

renderCategories(filtered);

});

if(window.innerWidth < 1200){

window.addEventListener("scroll", function(){

const player =
document.querySelector(".player-wrapper");

const scrollTop =
window.pageYOffset ||
document.documentElement.scrollTop;

if(scrollTop > 250){
player.classList.add("mini");
}else{
player.classList.remove("mini");
}

});

}

</script>

</body>
</html>
